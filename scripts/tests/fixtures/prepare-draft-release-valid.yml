name: Prepare draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release-draft:
    environment: release-draft
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Runtime preflight
        id: runtime
        run: |
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REPOSITORY" = context-engine-app/context-engine-mcp
          test "$GITHUB_REF" = "refs/tags/$TAG_NAME"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/prepare-draft-release.yml@refs/tags/$TAG_NAME"
          sha256sum .github/workflows/prepare-draft-release.yml >> "$GITHUB_OUTPUT"
          printf 'SOURCE_RUN_ID=%s\n' "$SOURCE_RUN_ID"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Python environment
        run: |
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements.txt

      - name: Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Preflight existing draft
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(.venv/bin/python scripts/prepare_draft_release.py inspect --tag "$TAG_NAME" --repository "$GITHUB_REPOSITORY" --output-dir "$RUNNER_TEMP/preflight-assets")
          status=$(jq -er '.status' <<< "$result")
          case "$status" in
            missing) printf 'skip_source=false\n' >> "$GITHUB_OUTPUT" ;;
            partial) jq -e '.marker | type == "object"' <<< "$result" > /dev/null; printf 'skip_source=false\n' >> "$GITHUB_OUTPUT" ;;
            verified)
              jq -e '.marker | type == "object"' <<< "$result" > "$RUNNER_TEMP/preflight-marker.json"
              .venv/bin/python scripts/validate_release_provenance.py public-draft --root "$RUNNER_TEMP/preflight-assets" --schemas schemas --marker "$RUNNER_TEMP/preflight-marker.json" --output-plan "$RUNNER_TEMP/preflight-plan.json"
              jq -e '.source_run.id and .public_workflow.path and .public_workflow.commit == $GITHUB_SHA and .public_workflow.sha256 == $RUNTIME_WORKFLOW_SHA256 and .distribution_commit == $GITHUB_SHA and .distribution_tag_target == $GITHUB_SHA' "$RUNNER_TEMP/preflight-plan.json"
              .venv/bin/python scripts/validate_channel_candidates.py --root "$RUNNER_TEMP/preflight-assets" --schemas schemas
              cosign verify-blob --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$SOURCE_REPOSITORY" --certificate-github-workflow-ref "refs/tags/$TAG_NAME" --certificate-github-workflow-sha "$SOURCE_COMMIT" --certificate-github-workflow-name Release --certificate-github-workflow-trigger push --bundle "$RUNNER_TEMP/preflight-assets/SHA256SUMS.sigstore.json" "$RUNNER_TEMP/preflight-assets/SHA256SUMS"
              printf 'skip_source=true\n' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Reader token
        id: artifact-reader
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: id
          private-key: key
          owner: context-engine-app
          repositories: context-engine
          permission-actions: read
          permission-contents: read

      - name: Source and artifact verification
        id: source-artifact
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
        run: |
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY" > repository.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" > artifacts.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/git/ref/tags/$TAG_NAME" > tag-ref.json
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/git/tags/$TAG_SHA" > tag-object.json
          jq -e '.id and .head_sha and .head_branch and .head_repository.full_name and .head_repository.id and .repository.full_name and .repository.id and .path and .event and .status and .conclusion and .head_sha' run.json
          jq -e '.ref and .object.sha' tag-ref.json
          jq -e '.object.sha' tag-object.json
          jq -e '.artifacts[] | select(.name == "staging-envelope" and .id > 0 and .size_in_bytes > 0 and (.digest | test("^sha256:[0-9a-f]{64}$")) and .workflow_run.id and .workflow_run.head_sha and .workflow_run.head_branch and .workflow_run.repository_id and .workflow_run.head_repository_id and (.expires_at | fromdateiso8601) >= (now + 3600) and .expired == false)' artifacts.json
          jq -r '.content' workflow.json | base64 --decode > release.yml
          printf 'artifact_id=1\nartifact_digest=sha256:%064d\nartifact_expires_at=2030-01-01T00:00:00Z\nsource_commit=%040d\nsource_run_attempt=1\nsource_workflow_sha256=%064d\n' 0 0 0 >> "$GITHUB_OUTPUT"

      - name: Download artifact
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.source-artifact.outputs.artifact_id }}
          path: staged-release
          github-token: ${{ steps.artifact-reader.outputs.token }}
          repository: context-engine-app/context-engine
          run-id: ${{ inputs.source_run_id }}

      - name: Revoke reader
        if: ${{ always() && steps.preflight.outputs.skip_source != 'true' && steps.artifact-reader.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token

      - name: Staging validator
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        run: .venv/bin/python scripts/validate_release_provenance.py staging --root staged-release --schemas schemas --output-plan validated-plan.json

      - name: Candidate validator
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        run: .venv/bin/python scripts/validate_channel_candidates.py --root staged-release --schemas schemas

      - name: Staging Cosign
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        run: |
          cosign verify-blob --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$SOURCE_REPOSITORY" --certificate-github-workflow-ref "refs/tags/$TAG_NAME" --certificate-github-workflow-sha "$SOURCE_COMMIT" --certificate-github-workflow-name Release --certificate-github-workflow-trigger push --bundle staged-release/SHA256SUMS.sigstore.json staged-release/SHA256SUMS
          cosign verify-blob --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$SOURCE_REPOSITORY" --certificate-github-workflow-ref "refs/tags/$TAG_NAME" --certificate-github-workflow-sha "$SOURCE_COMMIT" --certificate-github-workflow-name Release --certificate-github-workflow-trigger push --bundle staged-release/staging-attestation.sigstore.json staged-release/staging-attestation.json

      - name: Bind release evidence
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        env:
          RUNTIME_WORKFLOW_SHA256: ${{ steps.runtime.outputs.workflow_sha256 }}
        run: |
          jq -e '.source_workflow and .public_workflow and .distribution_commit and .distribution_tag_target' validated-plan.json
          jq -e '.source_workflows.release and .workflow_bindings.draft and .distribution_commit and .distribution_tag_target' staged-release/release-manifest.json
          jq -e '.workflows["source-release"] and .workflows["public-draft"] and .source_commit and .distribution_commit and .distribution_tag_target' staged-release/release-provenance.json
          jq -e '.workflow_bindings["source-release"] and .workflow_bindings["public-draft"] and .run.id and .attempt and .source_commit and .distribution_commit and .distribution_tag_target' staged-release/staging-attestation.json
          printf 'validated-plan.json release-provenance.json staging-attestation.json source_workflow source_commit workflow_bindings.draft distribution_commit distribution_tag_target GITHUB_SHA RUNTIME_WORKFLOW_SHA256 run.id attempt SOURCE_RUN_ID\n'

      - name: Expiry recheck
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        env:
          ARTIFACT_EXPIRES_AT: ${{ steps.source-artifact.outputs.artifact_expires_at }}
        run: |
          now=$(date -u +%s); expires=$(date -u -d "$ARTIFACT_EXPIRES_AT" +%s); test "$expires" -ge "$((now + 3600))"

      - name: Writer token
        id: release-writer
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: id
          private-key: key
          owner: context-engine-app
          repositories: context-engine-mcp
          permission-contents: write

      - name: Prepare
        id: draft-prepare
        if: ${{ steps.preflight.outputs.skip_source != 'true' }}
        env:
          GH_TOKEN: ${{ steps.release-writer.outputs.token }}
        run: |
          .venv/bin/python scripts/prepare_draft_release.py prepare --plan validated-plan.json --staged-assets staged-release --artifact-id 1 --artifact-digest sha256:$(printf '%064d' 0) --artifact-expires-at 2030-01-01T00:00:00Z --public-run-id "$GITHUB_RUN_ID" --public-run-attempt "$GITHUB_RUN_ATTEMPT" --repository context-engine-app/context-engine-mcp | tee "$RUNNER_TEMP/draft-prepare.json"
          jq -e '.state == "verified" and .asset_count == 15' "$RUNNER_TEMP/draft-prepare.json"

      - name: Inspect
        id: draft-inspect
        if: ${{ always() && steps.preflight.outputs.skip_source != 'true' && steps.release-writer.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.release-writer.outputs.token }}
        run: |
          .venv/bin/python scripts/prepare_draft_release.py inspect --tag "$TAG_NAME" --repository context-engine-app/context-engine-mcp --output-dir "$RUNNER_TEMP/draft-assets" > "$RUNNER_TEMP/draft-inspect.json"
          jq -e '.status == "verified" and .asset_count == 15' "$RUNNER_TEMP/draft-inspect.json"

      - name: Public draft validation
        if: ${{ always() && steps.preflight.outputs.skip_source != 'true' && steps.release-writer.outputs.token != '' }}
        run: |
          jq -e '.marker' "$RUNNER_TEMP/draft-inspect.json" > "$RUNNER_TEMP/draft-marker.json"
          .venv/bin/python scripts/validate_release_provenance.py public-draft --root "$RUNNER_TEMP/draft-assets" --schemas schemas --marker "$RUNNER_TEMP/draft-marker.json" --output-plan "$RUNNER_TEMP/draft-plan.json"
          .venv/bin/python scripts/validate_channel_candidates.py --root "$RUNNER_TEMP/draft-assets" --schemas schemas
          cosign verify-blob --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository "$SOURCE_REPOSITORY" --certificate-github-workflow-ref "refs/tags/$TAG_NAME" --certificate-github-workflow-sha "$SOURCE_COMMIT" --certificate-github-workflow-name Release --certificate-github-workflow-trigger push --bundle "$RUNNER_TEMP/draft-assets/SHA256SUMS.sigstore.json" "$RUNNER_TEMP/draft-assets/SHA256SUMS"

      - name: Revoke writer
        if: ${{ always() && steps.preflight.outputs.skip_source != 'true' && steps.release-writer.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.release-writer.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token
