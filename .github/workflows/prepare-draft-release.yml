name: Publish release

run-name: Publish ${{ inputs.tag }} from source run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string
      source_run_id:
        description: Successful private Release workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-publish:
    name: Validate and publish release
    environment: release-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out public workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate protected inputs
        env:
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^(v|repository-bootstrap-v)(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be stable"
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::source run ID must be a positive integer"
            exit 1
          fi
          test "$GITHUB_REPOSITORY" = "context-engine-app/context-engine-mcp"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Create pinned Python environment
        run: |
          set -euo pipefail
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements.txt

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.0.6
        with:
          cosign-release: v3.0.6

      - name: Create private reader App token
        id: artifact-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.0
        with:
          client-id: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: context-engine
          permission-actions: read
          permission-contents: read

      - name: Verify source run and staging artifact
        id: source-artifact
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
          SOURCE_REPOSITORY: context-engine-app/context-engine
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/source-run.json"
          repository_json="$RUNNER_TEMP/source-repository.json"
          artifacts_json="$RUNNER_TEMP/source-artifacts.json"
          tag_ref_json="$RUNNER_TEMP/source-tag-ref.json"
          tag_object_json="$RUNNER_TEMP/source-tag-object.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY" > "$repository_json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$run_json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" > "$artifacts_json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/git/ref/tags/$TAG_NAME" > "$tag_ref_json"
          source_repository_id=$(jq -er '.id | select(type == "number" and . > 0)' "$repository_json")
          source_commit=$(jq -er '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$run_json")
          jq -e --arg tag "$TAG_NAME" --arg repository "$SOURCE_REPOSITORY" --argjson run_id "$SOURCE_RUN_ID" --argjson repository_id "$source_repository_id" \
            '.id == $run_id and .name == "Release" and .path == ".github/workflows/release.yml" and .event == "push" and .status == "completed" and .conclusion == "success" and .head_branch == $tag and .head_repository.full_name == $repository and .repository.full_name == $repository and .head_repository.id == $repository_id and .repository.id == $repository_id' "$run_json" > /dev/null
          jq -e --arg expected_ref "refs/tags/$TAG_NAME" '.ref == $expected_ref and (.object.sha | type) == "string" and (.object.type == "commit" or .object.type == "tag")' "$tag_ref_json" > /dev/null
          tag_object_type=$(jq -er '.object.type' "$tag_ref_json")
          tag_object_sha=$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$tag_ref_json")
          if [[ "$tag_object_type" == "tag" ]]; then
            gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$SOURCE_REPOSITORY/git/tags/$tag_object_sha" > "$tag_object_json"
            tag_commit_sha=$(jq -er '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$tag_object_json")
          else
            tag_commit_sha="$tag_object_sha"
          fi
          test "$tag_commit_sha" = "$source_commit"
          artifact=$(jq -e --argjson run_id "$SOURCE_RUN_ID" --arg source_commit "$source_commit" --arg tag "$TAG_NAME" --argjson repository_id "$source_repository_id" \
            '[.artifacts[] | select(.name == "staging-envelope" and (.id | type) == "number" and .id > 0 and (.size_in_bytes | type) == "number" and .size_in_bytes > 0 and (.digest | type) == "string" and (.digest | test("^sha256:[0-9a-f]{64}$")) and .expired == false and .workflow_run.id == $run_id and .workflow_run.head_sha == $source_commit and .workflow_run.head_branch == $tag and .workflow_run.repository_id == $repository_id and .workflow_run.head_repository_id == $repository_id)] | if length == 1 then .[0] else error("staging artifact identity mismatch") end' "$artifacts_json")
          {
            printf 'artifact_id=%s\n' "$(jq -er '.id' <<<"$artifact")"
            printf 'artifact_digest=%s\n' "$(jq -er '.digest' <<<"$artifact")"
            printf 'artifact_expires_at=%s\n' "$(jq -er '.expires_at' <<<"$artifact")"
            printf 'source_commit=%s\n' "$source_commit"
            printf 'source_run_attempt=%s\n' "$(jq -er '.run_attempt' "$run_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact private staging artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          artifact-ids: ${{ steps.source-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: staged-release
          github-token: ${{ steps.artifact-reader.outputs.token }}
          repository: context-engine-app/context-engine
          run-id: ${{ inputs.source_run_id }}

      - name: Revoke private reader token
        if: ${{ always() && steps.artifact-reader.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token

      - name: Validate staging and candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ steps.source-artifact.outputs.source_commit }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_release_provenance.py staging --root staged-release --schemas schemas --output-plan validated-plan.json
          profile=$(jq -er '.profile' validated-plan.json)
          case "$profile" in
            desktop|desktop-linux) .venv/bin/python scripts/validate_channel_candidates.py --root staged-release --schemas schemas ;;
            repository-bootstrap) test ! -e staged-release/channel-candidates.json && test ! -e staged-release/channel-candidates.tar.gz ;;
            *) echo "::error::unsupported profile: $profile"; exit 1 ;;
          esac
          jq -e --arg tag "$TAG_NAME" --arg source_commit "$SOURCE_COMMIT" --argjson source_run_id "$SOURCE_RUN_ID" \
            '.tag == $tag and .source_commit == $source_commit and .source_run.id == $source_run_id and .source_repository == "context-engine-app/context-engine" and .distribution_repository == "context-engine-app/context-engine-mcp" and .public_workflow.path == ".github/workflows/prepare-draft-release.yml"' validated-plan.json > /dev/null
          distribution_commit=$(jq -er '.distribution_commit' validated-plan.json)
          public_ref=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")
          public_type=$(jq -er '.object.type' <<<"$public_ref")
          public_sha=$(jq -er '.object.sha' <<<"$public_ref")
          if [[ "$public_type" == "tag" ]]; then
            public_sha=$(gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$GITHUB_REPOSITORY/git/tags/$public_sha" | jq -er '.object.sha')
          fi
          test "$public_sha" = "$distribution_commit"

      - name: Verify signed staging checksums
        env:
          SOURCE_COMMIT: ${{ steps.source-artifact.outputs.source_commit }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          certificate_identity="https://github.com/context-engine-app/context-engine/.github/workflows/release.yml@refs/tags/$TAG_NAME"
          for pair in "SHA256SUMS SHA256SUMS.sigstore.json" "staging-attestation.json staging-attestation.sigstore.json"; do
            read -r payload bundle <<<"$pair"
            cosign verify-blob --certificate-identity "$certificate_identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-github-workflow-repository context-engine-app/context-engine --certificate-github-workflow-ref "refs/tags/$TAG_NAME" --certificate-github-workflow-sha "$SOURCE_COMMIT" --certificate-github-workflow-name Release --certificate-github-workflow-trigger push --bundle "staged-release/$bundle" "staged-release/$payload"
          done

      - name: Create public publisher App token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.0
        with:
          client-id: ${{ vars.RELEASE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: context-engine-mcp
          permission-contents: write

      - name: Publish exact immutable release
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: .venv/bin/python -m scripts.prepare_draft_release --plan validated-plan.json --staged-assets staged-release --tag "$TAG_NAME" --repository "$GITHUB_REPOSITORY"

      - name: Revoke public publisher token
        if: ${{ always() && steps.publisher.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token
