name: Prepare package channels

run-name: Prepare package channels for ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable public release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-channels-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Create package-channel pull requests
    environment: release-channel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public package tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Create isolated Python environment
        run: |
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements.txt

      - name: Validate immutable release and channel candidates
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          release=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,tagName)
          jq -e --arg tag "$TAG_NAME" '.tagName == $tag and .isDraft == false and .isImmutable == true' <<< "$release" > /dev/null
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern release-manifest.json \
            --pattern channel-candidates.json \
            --pattern channel-candidates.tar.gz
          .venv/bin/python scripts/validate_channel_candidates.py \
            --root "$RUNNER_TEMP/release" --schemas schemas

      - name: Create Homebrew installation token
        id: homebrew
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ vars.PACKAGE_METADATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_METADATA_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Create Scoop installation token
        id: scoop
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.0.0
        with:
          client-id: ${{ vars.PACKAGE_METADATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGE_METADATA_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: scoop-bucket
          permission-contents: write
          permission-pull-requests: write

      - name: Create channel pull requests
        env:
          HOMEBREW_GH_TOKEN: ${{ steps.homebrew.outputs.token }}
          SCOOP_GH_TOKEN: ${{ steps.scoop.outputs.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/prepare_package_channels.py apply \
            --tag "$TAG_NAME" \
            --candidate-root "$RUNNER_TEMP/release"

      - name: Revoke Homebrew installation token
        if: ${{ always() && steps.homebrew.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.homebrew.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token

      - name: Revoke Scoop installation token
        if: ${{ always() && steps.scoop.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.scoop.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token
