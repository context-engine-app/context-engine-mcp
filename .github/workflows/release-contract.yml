name: Release contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Verify release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public contract
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Create isolated Python environment
        run: |
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements-dev.txt

      - name: Check protected draft workflow
        run: |
          .venv/bin/python scripts/check_prepare_draft_workflow.py .github/workflows/prepare-draft-release.yml
          .venv/bin/python scripts/check_publish_draft_workflow.py .github/workflows/publish-draft-release.yml

      - name: Run all public Python unit tests
        run: |
          .venv/bin/python -m unittest discover -s scripts/tests -p 'test*.py' -v

      - name: Verify portable contract bytes
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              ".github/workflows/publish-draft-release.yml": "08aeadd481793a37f1f9223aaabf514cf996bbeb3758d2c8103acad54db244bb",
              "schemas/release-manifest.schema.json": "055a20ee520fbffc27dc3527c548eb50a76e1aa247072132d0f685ed40fdf395",
              "schemas/release-provenance.schema.json": "2cae7a72248fd279f4ba06e905daf7c5693393b74b3b0e24d7b9c0092fbed051",
              "schemas/channel-candidates.schema.json": "7ce660193dc346c70fd0c8db57bd1d91d1743d3b6059959b96f76443d037d57a",
              "schemas/staging-attestation.schema.json": "b8f1017ce278f762772e236eb08bf18a3c52b65f0e1e30c1d27cace51d305a6d",
              "scripts/validate_release_provenance.py": "34fe42956abea7df4cce5677e1d2678c5ee7f738e02c953f8970a8c62786d008",
              "scripts/validate_channel_candidates.py": "75c90fae9862ae40e4400d459488fdb6c6b5718e0d1ba677db94c48e8ca312d4",
              "scripts/publish_draft_release.py": "a03e5f3954ae70714b5522f078c9f25f581fb8aafdbe656d3962427d50350dc4",
              "scripts/check_publish_draft_workflow.py": "e4e4291f9b064719484d332be54688fe669646ec38b3ad9db555f299e8941938",
          }
          for filename, expected_sha256 in expected.items():
              path = Path(filename)
              actual_sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_sha256 != expected_sha256:
                  raise SystemExit(f"{filename}: expected {expected_sha256}, got {actual_sha256}")
          PY

      - name: Check portable validator interfaces
        run: |
          .venv/bin/python scripts/validate_release_provenance.py --help
          .venv/bin/python scripts/validate_channel_candidates.py --help
          .venv/bin/python scripts/publish_draft_release.py --help

      - name: Run BasedPyright for all public Python
        run: |
          .venv/bin/basedpyright scripts

      - name: Run Ruff checks for all public Python
        run: |
          .venv/bin/ruff check scripts

      - name: Check Ruff formatting for all public Python
        run: |
          .venv/bin/ruff format --check scripts
