name: Publish draft release

run-name: Publish ${{ inputs.tag }} from draft run ${{ inputs.draft_run_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified public draft release tag
        required: true
        type: string
      draft_run_id:
        description: Successful Prepare draft release workflow run ID
        required: true
        type: string

permissions:
  contents: read # Read the verified public draft release and repository settings.
  actions: read # Revalidate the exact public draft workflow run.
  attestations: read # Verify immutable release and asset attestations.

concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate immutable publication inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate inputs and runtime binding
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^(v|repository-bootstrap-v)(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::release tag must be a stable or repository-bootstrap version"
            exit 1
          fi
          if [[ ! "$DRAFT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::draft run ID must be a positive integer"
            exit 1
          fi
          test "$GITHUB_REPOSITORY" = "context-engine-app/context-engine-mcp"
          runtime_commit="$GITHUB_SHA"
          canonical_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/publish-draft-release.yml@refs/tags/$TAG_NAME"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          if test "$GITHUB_WORKFLOW_REF" = "$canonical_workflow_ref"; then
            test "$GITHUB_REF" = "refs/tags/$TAG_NAME"
            binding_commit="$GITHUB_SHA"
            sha256sum .github/workflows/publish-draft-release.yml | cut -d' ' -f1 > "$RUNNER_TEMP/publish-workflow.sha256"
            sha256sum .github/workflows/prepare-package-channels.yml | cut -d' ' -f1 > "$RUNNER_TEMP/channels-workflow.sha256"
          else
            if [[ ! "$GITHUB_REF" =~ ^refs/tags/release-reauthorization/$TAG_NAME/public-publish/[0-9a-fA-F]{40}$ ]]; then
              echo "::error::release-reauthorization ref is required"
              exit 1
            fi
            test "$GITHUB_REF" = "refs/tags/release-reauthorization/$TAG_NAME/public-publish/$runtime_commit"
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/publish-draft-release.yml@$GITHUB_REF"
            reauth_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/release-reauthorization/$TAG_NAME/public-publish/$runtime_commit")
            reauth_type=$(jq -er '.object.type' <<<"$reauth_ref")
            reauth_object=$(jq -er '.object.sha' <<<"$reauth_ref")
            if test "$reauth_type" = "tag"; then
              reauth_target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$reauth_object" | jq -er '.object | select(.type == "commit") | .sha')
            else
              reauth_target="$reauth_object"
            fi
            test "$reauth_target" = "$runtime_commit"
            original_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")
            original_type=$(jq -er '.object.type' <<<"$original_ref")
            original_object=$(jq -er '.object.sha' <<<"$original_ref")
            if test "$original_type" = "tag"; then
              original_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$original_object" | jq -er '.object | select(.type == "commit") | .sha')
            else
              original_commit="$original_object"
            fi
            authorization="authorizations/$TAG_NAME/public-publish/$runtime_commit.json"
            [[ -r "$authorization" ]]
            [[ -r schemas/workflow-reauthorization.schema.json ]]
            original_sha256=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-draft-release.yml?ref=$original_commit" | jq -er '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d' ' -f1)
            channels_sha256=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/prepare-package-channels.yml?ref=$original_commit" | jq -er '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d' ' -f1)
            replacement_sha256=$(sha256sum .github/workflows/publish-draft-release.yml | cut -d' ' -f1)
            binding_commit="$original_commit"
            printf '%s\n' "$original_commit" > "$RUNNER_TEMP/reauth-original-commit"
            printf '%s\n' "$original_sha256" > "$RUNNER_TEMP/reauth-original-sha256"
            printf '%s\n' "$original_sha256" > "$RUNNER_TEMP/publish-workflow.sha256"
            printf '%s\n' "$replacement_sha256" > "$RUNNER_TEMP/reauth-replacement-sha256"
            printf '%s\n' "$channels_sha256" > "$RUNNER_TEMP/channels-workflow.sha256"
            touch "$RUNNER_TEMP/reauth-required"
          fi
          printf '%s\n' "$binding_commit" > "$RUNNER_TEMP/binding-commit"

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Create pinned Python environment
        run: |
          set -euo pipefail
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements.txt

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.0.6
        with:
          cosign-release: v3.0.6

      - name: Re-download and validate verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          if [[ -e "$RUNNER_TEMP/reauth-required" ]]; then
            original_commit=$(cat "$RUNNER_TEMP/reauth-original-commit")
            original_sha256=$(cat "$RUNNER_TEMP/reauth-original-sha256")
            replacement_sha256=$(cat "$RUNNER_TEMP/reauth-replacement-sha256")
            .venv/bin/python scripts/validate_release_provenance.py reauthorization \
              --record "authorizations/$TAG_NAME/public-publish/$GITHUB_SHA.json" \
              --schemas schemas --tag "$TAG_NAME" --stage public-publish \
              --runtime-commit "$GITHUB_SHA" \
              --original-path .github/workflows/publish-draft-release.yml \
              --original-commit "$original_commit" --original-sha256 "$original_sha256" \
              --replacement-path .github/workflows/publish-draft-release.yml \
              --replacement-commit "$GITHUB_SHA" --replacement-sha256 "$replacement_sha256"
          fi
          assets_dir="$RUNNER_TEMP/preflight-assets"
          inspect_file="$RUNNER_TEMP/preflight-inspect.json"
          marker_file="$RUNNER_TEMP/preflight-marker.json"
          plan_file="$RUNNER_TEMP/preflight-plan.json"
          .venv/bin/python scripts/prepare_draft_release.py inspect \
            --tag "$TAG_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$assets_dir" > "$inspect_file"
          jq -e --arg tag "$TAG_NAME" \
            '.tag == $tag and .status == "verified" and .state == "verified" and .read_only == true and (.asset_count | type == "number" and . > 0)' \
            "$inspect_file" > /dev/null
          jq -e '.marker' "$inspect_file" > "$marker_file"
          .venv/bin/python scripts/validate_release_provenance.py public-publish \
            --root "$assets_dir" \
            --schemas schemas \
            --marker "$marker_file" \
            --output-plan "$plan_file"
          profile=$(jq -er '.profile' "$plan_file")
          expected_asset_count=$(jq -er '.assets | length' "$plan_file")
          jq -e --argjson expected_asset_count "$expected_asset_count" '.asset_count == $expected_asset_count' "$inspect_file" > /dev/null
          case "$profile" in
            desktop|desktop-linux)
              .venv/bin/python scripts/validate_channel_candidates.py \
                --root "$assets_dir" \
                --schemas schemas
              ;;
            repository-bootstrap)
              test ! -e "$assets_dir/channel-candidates.json"
              test ! -e "$assets_dir/channel-candidates.tar.gz"
              ;;
            *)
              echo "::error::unsupported release profile: $profile"
              exit 1
              ;;
          esac
          if [[ -e "$RUNNER_TEMP/reauth-required" ]]; then
            original_commit=$(cat "$RUNNER_TEMP/reauth-original-commit")
            original_sha256=$(cat "$RUNNER_TEMP/reauth-original-sha256")
            jq -e --arg commit "$original_commit" --arg sha "$original_sha256" \
              '.public_workflows.publish.commit == $commit and .public_workflows.publish.sha256 == $sha' \
              "$plan_file" > /dev/null
          fi

          publish_sha256=$(cat "$RUNNER_TEMP/publish-workflow.sha256")
          channels_sha256=$(cat "$RUNNER_TEMP/channels-workflow.sha256")
          binding_commit=$(cat "$RUNNER_TEMP/binding-commit")
          jq -e \
            --arg tag "$TAG_NAME" \
            --arg commit "$binding_commit" \
            --arg publish_sha256 "$publish_sha256" \
            --arg channels_sha256 "$channels_sha256" \
            --argjson draft_run_id "$DRAFT_RUN_ID" \
            '.tag == $tag and
             .distribution_commit == $commit and
             .distribution_tag_target == $commit and
             .draft_run.id == $draft_run_id and
             .public_workflows.publish.path == ".github/workflows/publish-draft-release.yml" and
             .public_workflows.publish.commit == $commit and
             .public_workflows.publish.sha256 == $publish_sha256 and
             .public_workflows.channels.path == ".github/workflows/prepare-package-channels.yml" and
             .public_workflows.channels.commit == $commit and
             .public_workflows.channels.sha256 == $channels_sha256' \
            "$plan_file" > /dev/null

          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DRAFT_RUN_ID" \
            > "$RUNNER_TEMP/draft-run.json"
          draft_run_attempt=$(jq -er '.draft_run.attempt' "$plan_file")
          jq -e \
            --arg tag "$TAG_NAME" \
            --arg commit "$binding_commit" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$DRAFT_RUN_ID" \
            --argjson run_attempt "$draft_run_attempt" \
            '.id == $run_id and
             .run_attempt == $run_attempt and
             .path == ".github/workflows/prepare-draft-release.yml" and
             .event == "workflow_dispatch" and
             .status == "completed" and
             .conclusion == "success" and
             .head_branch == $tag and
             .head_sha == $commit and
             .repository.full_name == $repository' \
            "$RUNNER_TEMP/draft-run.json" > /dev/null

          source_repository=$(jq -er '.source_repository' "$plan_file")
          source_commit=$(jq -er '.source_commit' "$plan_file")
          certificate_identity="https://github.com/${source_repository}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
          cosign verify-blob \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$source_repository" \
            --certificate-github-workflow-ref "refs/tags/${TAG_NAME}" \
            --certificate-github-workflow-sha "$source_commit" \
            --certificate-github-workflow-name Release \
            --certificate-github-workflow-trigger push \
            --bundle "$assets_dir/SHA256SUMS.sigstore.json" \
            "$assets_dir/SHA256SUMS"

  publish:
    name: Publish verified immutable release
    needs: preflight
    environment: release-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out public workflow tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Revalidate protected runtime binding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "context-engine-app/context-engine-mcp"
          runtime_commit="$GITHUB_SHA"
          canonical_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/publish-draft-release.yml@refs/tags/$TAG_NAME"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          if test "$GITHUB_WORKFLOW_REF" = "$canonical_workflow_ref"; then
            test "$GITHUB_REF" = "refs/tags/$TAG_NAME"
            binding_commit="$GITHUB_SHA"
            sha256sum .github/workflows/publish-draft-release.yml | cut -d' ' -f1 > "$RUNNER_TEMP/publish-workflow.sha256"
            sha256sum .github/workflows/prepare-package-channels.yml | cut -d' ' -f1 > "$RUNNER_TEMP/channels-workflow.sha256"
          else
            if [[ ! "$GITHUB_REF" =~ ^refs/tags/release-reauthorization/$TAG_NAME/public-publish/[0-9a-fA-F]{40}$ ]]; then
              echo "::error::release-reauthorization ref is required"
              exit 1
            fi
            test "$GITHUB_REF" = "refs/tags/release-reauthorization/$TAG_NAME/public-publish/$runtime_commit"
            test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/publish-draft-release.yml@$GITHUB_REF"
            reauth_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/release-reauthorization/$TAG_NAME/public-publish/$runtime_commit")
            reauth_type=$(jq -er '.object.type' <<<"$reauth_ref")
            reauth_object=$(jq -er '.object.sha' <<<"$reauth_ref")
            if test "$reauth_type" = "tag"; then
              reauth_target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$reauth_object" | jq -er '.object | select(.type == "commit") | .sha')
            else
              reauth_target="$reauth_object"
            fi
            test "$reauth_target" = "$runtime_commit"
            original_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME")
            original_type=$(jq -er '.object.type' <<<"$original_ref")
            original_object=$(jq -er '.object.sha' <<<"$original_ref")
            if test "$original_type" = "tag"; then
              original_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$original_object" | jq -er '.object | select(.type == "commit") | .sha')
            else
              original_commit="$original_object"
            fi
            authorization="authorizations/$TAG_NAME/public-publish/$runtime_commit.json"
            [[ -r "$authorization" ]]
            [[ -r schemas/workflow-reauthorization.schema.json ]]
            original_sha256=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-draft-release.yml?ref=$original_commit" | jq -er '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d' ' -f1)
            channels_sha256=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/prepare-package-channels.yml?ref=$original_commit" | jq -er '.content' | tr -d '\n' | base64 --decode | sha256sum | cut -d' ' -f1)
            replacement_sha256=$(sha256sum .github/workflows/publish-draft-release.yml | cut -d' ' -f1)
            binding_commit="$original_commit"
            printf '%s\n' "$original_commit" > "$RUNNER_TEMP/reauth-original-commit"
            printf '%s\n' "$original_sha256" > "$RUNNER_TEMP/reauth-original-sha256"
            printf '%s\n' "$original_sha256" > "$RUNNER_TEMP/publish-workflow.sha256"
            printf '%s\n' "$replacement_sha256" > "$RUNNER_TEMP/reauth-replacement-sha256"
            printf '%s\n' "$channels_sha256" > "$RUNNER_TEMP/channels-workflow.sha256"
            touch "$RUNNER_TEMP/reauth-required"
          fi
          test "$DRAFT_RUN_ID" -ge 1
          printf '%s\n' "$binding_commit" > "$RUNNER_TEMP/binding-commit"

      - name: Set up pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.11.13"

      - name: Create pinned Python environment
        run: |
          set -euo pipefail
          uv python install 3.11.13
          uv venv .venv --python 3.11.13
          uv pip install --python .venv/bin/python --requirement scripts/requirements.txt

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.0.6
        with:
          cosign-release: v3.0.6

      - name: Repeat complete draft and workflow validation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          if [[ -e "$RUNNER_TEMP/reauth-required" ]]; then
            original_commit=$(cat "$RUNNER_TEMP/reauth-original-commit")
            original_sha256=$(cat "$RUNNER_TEMP/reauth-original-sha256")
            replacement_sha256=$(cat "$RUNNER_TEMP/reauth-replacement-sha256")
            .venv/bin/python scripts/validate_release_provenance.py reauthorization \
              --record "authorizations/$TAG_NAME/public-publish/$GITHUB_SHA.json" \
              --schemas schemas --tag "$TAG_NAME" --stage public-publish \
              --runtime-commit "$GITHUB_SHA" \
              --original-path .github/workflows/publish-draft-release.yml \
              --original-commit "$original_commit" --original-sha256 "$original_sha256" \
              --replacement-path .github/workflows/publish-draft-release.yml \
              --replacement-commit "$GITHUB_SHA" --replacement-sha256 "$replacement_sha256"
          fi
          assets_dir="$RUNNER_TEMP/publish-assets"
          inspect_file="$RUNNER_TEMP/publish-inspect.json"
          marker_file="$RUNNER_TEMP/publish-marker.json"
          plan_file="$RUNNER_TEMP/publication-plan.json"
          .venv/bin/python scripts/prepare_draft_release.py inspect \
            --tag "$TAG_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$assets_dir" > "$inspect_file"
          jq -e --arg tag "$TAG_NAME" \
            '.tag == $tag and .status == "verified" and .state == "verified" and .read_only == true and (.asset_count | type == "number" and . > 0)' \
            "$inspect_file" > /dev/null
          jq -e '.marker' "$inspect_file" > "$marker_file"
          .venv/bin/python scripts/validate_release_provenance.py public-publish \
            --root "$assets_dir" \
            --schemas schemas \
            --marker "$marker_file" \
            --output-plan "$plan_file"
          profile=$(jq -er '.profile' "$plan_file")
          expected_asset_count=$(jq -er '.assets | length' "$plan_file")
          jq -e --argjson expected_asset_count "$expected_asset_count" '.asset_count == $expected_asset_count' "$inspect_file" > /dev/null
          case "$profile" in
            desktop|desktop-linux)
              .venv/bin/python scripts/validate_channel_candidates.py \
                --root "$assets_dir" \
                --schemas schemas
              ;;
            repository-bootstrap)
              test ! -e "$assets_dir/channel-candidates.json"
              test ! -e "$assets_dir/channel-candidates.tar.gz"
              ;;
            *)
              echo "::error::unsupported release profile: $profile"
              exit 1
              ;;
          esac
          if [[ -e "$RUNNER_TEMP/reauth-required" ]]; then
            original_commit=$(cat "$RUNNER_TEMP/reauth-original-commit")
            original_sha256=$(cat "$RUNNER_TEMP/reauth-original-sha256")
            jq -e --arg commit "$original_commit" --arg sha "$original_sha256" \
              '.public_workflows.publish.commit == $commit and .public_workflows.publish.sha256 == $sha' \
              "$plan_file" > /dev/null
          fi
          publish_sha256=$(cat "$RUNNER_TEMP/publish-workflow.sha256")
          channels_sha256=$(cat "$RUNNER_TEMP/channels-workflow.sha256")
          binding_commit=$(cat "$RUNNER_TEMP/binding-commit")
          jq -e \
            --arg tag "$TAG_NAME" \
            --arg commit "$binding_commit" \
            --arg publish_sha256 "$publish_sha256" \
            --arg channels_sha256 "$channels_sha256" \
            --argjson draft_run_id "$DRAFT_RUN_ID" \
            '.tag == $tag and
             .distribution_commit == $commit and
             .distribution_tag_target == $commit and
             .draft_run.id == $draft_run_id and
             .public_workflows.publish.commit == $commit and
             .public_workflows.publish.sha256 == $publish_sha256 and
             .public_workflows.channels.commit == $commit and
             .public_workflows.channels.sha256 == $channels_sha256' \
            "$plan_file" > /dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$DRAFT_RUN_ID" \
            > "$RUNNER_TEMP/draft-run.json"
          draft_run_attempt=$(jq -er '.draft_run.attempt' "$plan_file")
          jq -e \
            --arg tag "$TAG_NAME" \
            --arg commit "$binding_commit" \
            --argjson run_id "$DRAFT_RUN_ID" \
            --argjson run_attempt "$draft_run_attempt" \
            '.id == $run_id and .run_attempt == $run_attempt and
             .path == ".github/workflows/prepare-draft-release.yml" and
             .status == "completed" and .conclusion == "success" and
             .head_branch == $tag and .head_sha == $commit' \
            "$RUNNER_TEMP/draft-run.json" > /dev/null
          source_repository=$(jq -er '.source_repository' "$plan_file")
          source_commit=$(jq -er '.source_commit' "$plan_file")
          certificate_identity="https://github.com/${source_repository}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
          cosign verify-blob \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$source_repository" \
            --certificate-github-workflow-ref "refs/tags/${TAG_NAME}" \
            --certificate-github-workflow-sha "$source_commit" \
            --certificate-github-workflow-name Release \
            --certificate-github-workflow-trigger push \
            --bundle "$assets_dir/SHA256SUMS.sigstore.json" \
            "$assets_dir/SHA256SUMS"

      - name: Create private artifact-reader App token
        id: artifact-reader
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          client-id: ${{ vars.ARTIFACT_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: context-engine
          permission-actions: read
          permission-contents: read

      - name: Independently verify private source run and workflow
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          plan_file="$RUNNER_TEMP/publication-plan.json"
          source_repository=$(jq -er '.source_repository' "$plan_file")
          source_run_id=$(jq -er '.source_run.id' "$plan_file")
          source_run_attempt=$(jq -er '.source_run.attempt' "$plan_file")
          source_commit=$(jq -er '.source_commit' "$plan_file")
          source_workflow_sha256=$(jq -er '.source_workflow.sha256' "$plan_file")
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$source_repository/actions/runs/$source_run_id" \
            > "$RUNNER_TEMP/source-run.json"
          jq -e \
            --arg tag "$TAG_NAME" \
            --arg commit "$source_commit" \
            --arg repository "$source_repository" \
            --argjson run_id "$source_run_id" \
            --argjson run_attempt "$source_run_attempt" \
            '.id == $run_id and .run_attempt == $run_attempt and
             .name == "Release" and .path == ".github/workflows/release.yml" and
             .event == "push" and .status == "completed" and .conclusion == "success" and
             .head_branch == $tag and .head_sha == $commit and
             .repository.full_name == $repository' \
            "$RUNNER_TEMP/source-run.json" > /dev/null
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$source_repository/contents/.github/workflows/release.yml?ref=$source_commit" \
            | jq -er '.content' | tr -d '\n' | base64 --decode \
            > "$RUNNER_TEMP/source-release.yml"
          test "$(sha256sum "$RUNNER_TEMP/source-release.yml" | cut -d' ' -f1)" = "$source_workflow_sha256"

      - name: Revoke private artifact-reader token
        if: ${{ always() && steps.artifact-reader.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.artifact-reader.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token

      - name: Create final publisher App token
        id: final-publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.2.1
        with:
          client-id: ${{ vars.IMMUTABLE_RELEASE_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMMUTABLE_RELEASE_PUBLISHER_APP_PRIVATE_KEY }}
          owner: context-engine-app
          repositories: context-engine-mcp
          permission-administration: read
          permission-contents: write

      - name: Require immutable releases
        env:
          GH_TOKEN: ${{ steps.final-publisher.outputs.token }}
        run: |
          set -euo pipefail
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            | jq -e '.enabled == true' > /dev/null

      - name: Verify live tag target before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_tag_target=$(jq -er '.distribution_tag_target' "$RUNNER_TEMP/publication-plan.json")
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
            > "$RUNNER_TEMP/live-tag-ref.json"
          jq -e --arg ref "refs/tags/$TAG_NAME" \
            '.ref == $ref and
             (.object.type == "commit" or .object.type == "tag") and
             (.object.sha | type == "string")' \
            "$RUNNER_TEMP/live-tag-ref.json" > /dev/null
          tag_object_type=$(jq -er '.object.type' "$RUNNER_TEMP/live-tag-ref.json")
          tag_object_sha=$(jq -er '.object.sha' "$RUNNER_TEMP/live-tag-ref.json")
          if test "$tag_object_type" = "tag"; then
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
              > "$RUNNER_TEMP/live-tag-object.json"
            jq -e --arg tag "$TAG_NAME" \
              '.tag == $tag and .object.type == "commit" and
               (.object.sha | type == "string")' \
              "$RUNNER_TEMP/live-tag-object.json" > /dev/null
            live_tag_target=$(jq -er '.object.sha' "$RUNNER_TEMP/live-tag-object.json")
          else
            live_tag_target="$tag_object_sha"
          fi
          if [[ ! "$live_tag_target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::live tag target is not a full commit SHA"
            exit 1
          fi
          test "$live_tag_target" = "$expected_tag_target"

      - name: Publish exact verified draft
        env:
          GH_TOKEN: ${{ steps.final-publisher.outputs.token }}
          DRAFT_RUN_ID: ${{ inputs.draft_run_id }}
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.publish_draft_release \
            --plan "$RUNNER_TEMP/publication-plan.json" \
            --repository "$GITHUB_REPOSITORY" \
            --draft-run-id "$DRAFT_RUN_ID" \
            | tee "$RUNNER_TEMP/publication-result.json"
          jq -e '.status == "published"' "$RUNNER_TEMP/publication-result.json" > /dev/null

      - name: Verify immutable release and every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_tag_target=$(jq -er '.distribution_tag_target' "$RUNNER_TEMP/publication-plan.json")
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" \
            > "$RUNNER_TEMP/frozen-tag-ref.json"
          jq -e --arg ref "refs/tags/$TAG_NAME" \
            '.ref == $ref and
             (.object.type == "commit" or .object.type == "tag") and
             (.object.sha | type == "string")' \
            "$RUNNER_TEMP/frozen-tag-ref.json" > /dev/null
          tag_object_type=$(jq -er '.object.type' "$RUNNER_TEMP/frozen-tag-ref.json")
          tag_object_sha=$(jq -er '.object.sha' "$RUNNER_TEMP/frozen-tag-ref.json")
          if test "$tag_object_type" = "tag"; then
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
              > "$RUNNER_TEMP/frozen-tag-object.json"
            jq -e --arg tag "$TAG_NAME" \
              '.tag == $tag and .object.type == "commit" and
               (.object.sha | type == "string")' \
              "$RUNNER_TEMP/frozen-tag-object.json" > /dev/null
            frozen_tag_target=$(jq -er '.object.sha' "$RUNNER_TEMP/frozen-tag-object.json")
          else
            frozen_tag_target="$tag_object_sha"
          fi
          if [[ ! "$frozen_tag_target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::frozen tag target is not a full commit SHA"
            exit 1
          fi
          test "$frozen_tag_target" = "$expected_tag_target"
          gh release verify "$TAG_NAME" --repo "$GITHUB_REPOSITORY"
          published_dir="$RUNNER_TEMP/published-assets"
          mkdir -p "$published_dir"
          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$published_dir"
          while IFS= read -r asset; do
            gh release verify-asset "$TAG_NAME" "$published_dir/$asset" \
              --repo "$GITHUB_REPOSITORY"
          done < <(jq -r '.assets[].name' "$RUNNER_TEMP/publication-plan.json")
          .venv/bin/python scripts/validate_release_provenance.py public-publish \
            --root "$published_dir" \
            --schemas schemas \
            --marker "$RUNNER_TEMP/publish-marker.json" \
            --output-plan "$RUNNER_TEMP/published-plan.json"
          profile=$(jq -er '.profile' "$RUNNER_TEMP/published-plan.json")
          case "$profile" in
            desktop|desktop-linux)
              .venv/bin/python scripts/validate_channel_candidates.py \
                --root "$published_dir" \
                --schemas schemas
              ;;
            repository-bootstrap)
              test ! -e "$published_dir/channel-candidates.json"
              test ! -e "$published_dir/channel-candidates.tar.gz"
              ;;
            *)
              echo "::error::unsupported release profile: $profile"
              exit 1
              ;;
          esac
          source_repository=$(jq -er '.source_repository' "$RUNNER_TEMP/published-plan.json")
          source_commit=$(jq -er '.source_commit' "$RUNNER_TEMP/published-plan.json")
          certificate_identity="https://github.com/${source_repository}/.github/workflows/release.yml@refs/tags/${TAG_NAME}"
          cosign verify-blob \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$source_repository" \
            --certificate-github-workflow-ref "refs/tags/${TAG_NAME}" \
            --certificate-github-workflow-sha "$source_commit" \
            --certificate-github-workflow-name Release \
            --certificate-github-workflow-trigger push \
            --bundle "$published_dir/SHA256SUMS.sigstore.json" \
            "$published_dir/SHA256SUMS"

      - name: Revoke final publisher token
        if: ${{ always() && steps.final-publisher.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.final-publisher.outputs.token }}
        run: |
          gh api --method DELETE -H "X-GitHub-Api-Version: 2026-03-10" /installation/token
